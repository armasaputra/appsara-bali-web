<!DOCTYPE html>
<html lang="id">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
	<title>Appsara Bali - Pembelajaran Aksara Bali</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
	<style>
		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
			user-select: none;
			-webkit-user-select: none;
		}

		body {
			background: radial-gradient(circle at center, #2C2018 0%, #16100B 100%);
			color: #F4ECE1;
			font-family: 'Outfit', sans-serif;
			overflow: hidden;
			width: 100vw;
			height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
		}

		/* Game Container Frame (9:16 Portrait Aspect Ratio) */
		.game-wrapper {
			position: relative;
			width: 100%;
			height: 100%;
			max-width: calc(100vh * (9 / 16));
			max-height: 100vh;
			aspect-ratio: 9 / 16;
			background-color: #000;
			box-shadow: 0 20px 60px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(207, 186, 152, 0.15);
			overflow: hidden;
			display: flex;
			align-items: center;
			justify-content: center;
		}

		@media (min-width: 768px) {
			.game-wrapper {
				border-radius: 20px;
				max-height: 96vh;
				margin: auto;
			}
		}

		#canvas {
			width: 100% !important;
			height: 100% !important;
			display: block;
			outline: none;
		}

		/* Loading Screen */
		#loading-screen {
			position: absolute;
			inset: 0;
			background: #1D140E radial-gradient(circle at center, #352418 0%, #160E08 100%);
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			z-index: 100;
			transition: opacity 0.5s ease;
		}

		.loading-content {
			text-align: center;
			width: 80%;
			max-width: 320px;
		}

		.game-title {
			font-size: 28px;
			font-weight: 700;
			letter-spacing: 2px;
			color: #EBD4B4;
			text-shadow: 0 4px 12px rgba(0, 0, 0, 0.6);
			margin-bottom: 8px;
		}

		.game-subtitle {
			font-size: 14px;
			color: #BAA187;
			margin-bottom: 30px;
			letter-spacing: 1px;
		}

		.progress-bar-bg {
			width: 100%;
			height: 14px;
			background: rgba(0, 0, 0, 0.5);
			border: 2px solid #5C3D26;
			border-radius: 12px;
			overflow: hidden;
			position: relative;
			box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
		}

		.progress-bar-fill {
			width: 0%;
			height: 100%;
			background: linear-gradient(90deg, #D49B43, #F6D678, #D49B43);
			background-size: 200% 100%;
			animation: shimmer 1.5s infinite;
			border-radius: 8px;
			transition: width 0.2s ease;
		}

		@keyframes shimmer {
			0% { background-position: 200% 0; }
			100% { background-position: -200% 0; }
		}

		.loading-status {
			margin-top: 14px;
			font-size: 13px;
			color: #CFBA98;
			letter-spacing: 0.5px;
		}

		/* Controls Overlay */
		.controls-bar {
			position: absolute;
			top: 12px;
			right: 12px;
			display: flex;
			gap: 8px;
			z-index: 50;
			opacity: 0.7;
			transition: opacity 0.2s;
		}

		.controls-bar:hover {
			opacity: 1.0;
		}

		.icon-btn {
			background: rgba(22, 16, 11, 0.75);
			border: 1px solid rgba(207, 186, 152, 0.3);
			color: #CFBA98;
			width: 38px;
			height: 38px;
			border-radius: 50%;
			display: flex;
			align-items: center;
			justify-content: center;
			cursor: pointer;
			backdrop-filter: blur(4px);
			transition: transform 0.1s, background 0.2s;
		}

		.icon-btn:active {
			transform: scale(0.92);
		}
	</style>
	$GODOT_HEAD_INCLUDE
</head>
<body>
	<div class="game-wrapper" id="game-wrapper">
		<div class="controls-bar">
			<button class="icon-btn" id="btn-fullscreen" title="Layar Penuh">
				<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
					<path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
				</svg>
			</button>
		</div>

		<!-- Loading Overlay -->
		<div id="loading-screen">
			<div class="loading-content">
				<div class="game-title">APPSARA BALI</div>
				<div class="game-subtitle">Media Pembelajaran Aksara Bali</div>
				<div class="progress-bar-bg">
					<div class="progress-bar-fill" id="progress-fill"></div>
				</div>
				<div class="loading-status" id="loading-status">Memuat permainan...</div>
			</div>
		</div>

		<canvas id="canvas">
			Browser Anda tidak mendukung HTML5 Canvas / WebGL.
		</canvas>
	</div>

	<script src="$GODOT_URL"></script>
	<script>
		const GODOT_CONFIG = $GODOT_CONFIG;
		const engine = new Engine(GODOT_CONFIG);

		const loadingScreen = document.getElementById('loading-screen');
		const progressFill = document.getElementById('progress-fill');
		const loadingStatus = document.getElementById('loading-status');
		const btnFullscreen = document.getElementById('btn-fullscreen');
		const gameWrapper = document.getElementById('game-wrapper');

		btnFullscreen.addEventListener('click', () => {
			if (!document.fullscreenElement) {
				if (gameWrapper.requestFullscreen) {
					gameWrapper.requestFullscreen();
				}
			} else {
				if (document.exitFullscreen) {
					document.exitFullscreen();
				}
			}
		});

		// Unlock WebAudio autoplay on first click/touch
		window.addEventListener('pointerdown', () => {
			if (typeof AudioContext !== 'undefined') {
				const ctx = new AudioContext();
				if (ctx.state === 'suspended') {
					ctx.resume();
				}
			}
		}, { once: true });

		// Start Godot Engine with progress tracking
		engine.startGame({
			onProgress: (current, total) => {
				if (total > 0) {
					const pct = Math.round((current / total) * 100);
					progressFill.style.width = pct + '%';
					loadingStatus.textContent = 'Memuat aset... (' + pct + '%)';
				} else {
					loadingStatus.textContent = 'Memuat permainan...';
				}
			}
		}).then(() => {
			loadingScreen.style.opacity = '0';
			setTimeout(() => {
				loadingScreen.style.display = 'none';
			}, 500);
		}).catch((err) => {
			console.error(err);
			loadingStatus.textContent = 'Gagal memuat permainan: ' + err.message;
		});
	</script>
</body>
</html>
