<!DOCTYPE html>
<html lang="id">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
		<title>Appsara Bali - Pembelajaran Aksara Bali</title>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
		<style>
			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
				user-select: none;
				-webkit-user-select: none;
			}

			html, body {
				margin: 0;
				padding: 0;
				border: 0;
				width: 100vw;
				height: 100vh;
				background-color: #000000;
				color: white;
				font-family: 'Outfit', sans-serif;
				overflow: hidden;
				touch-action: none;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
			}

			/* Canvas container */
			.game-container {
				position: relative;
				flex: 1;
				width: 100%;
				display: flex;
				align-items: center;
				justify-content: center;
				overflow: hidden;
				background-color: #000000;
			}

			#canvas {
				display: block;
				max-width: 100%;
				max-height: 100%;
				outline: none;
			}

			#canvas:focus {
				outline: none;
			}

			/* Bottom Controls Toolbar */
			.bottom-controls {
				width: 100%;
				height: 60px;
				background: #000000;
				display: flex;
				align-items: center;
				justify-content: center;
				z-index: 50;
				border-top: 1px solid rgba(255, 255, 255, 0.08);
			}

			.btn-fullscreen {
				display: inline-flex;
				align-items: center;
				gap: 8px;
				background: linear-gradient(180deg, #4A3320 0%, #291C12 100%);
				border: 1px solid #916840;
				color: #F8E2C2;
				font-family: 'Outfit', sans-serif;
				font-size: 15px;
				font-weight: 600;
				letter-spacing: 0.5px;
				padding: 10px 24px;
				border-radius: 25px;
				cursor: pointer;
				box-shadow: 0 4px 15px rgba(0, 0, 0, 0.7);
				transition: all 0.2s ease;
			}

			.btn-fullscreen:hover {
				background: linear-gradient(180deg, #5C4028 0%, #382517 100%);
				border-color: #E2B678;
				color: #FFFFFF;
				transform: translateY(-1px);
				box-shadow: 0 6px 20px rgba(226, 182, 120, 0.25);
			}

			.btn-fullscreen:active {
				transform: translateY(1px) scale(0.96);
			}

			/* Status / Loading Overlay */
			#status, #status-splash, #status-progress {
				position: absolute;
				left: 0;
				right: 0;
			}

			#status, #status-splash {
				top: 0;
				bottom: 0;
			}

			#status {
				background-color: #1A120B;
				display: flex;
				flex-direction: column;
				justify-content: center;
				align-items: center;
				visibility: hidden;
				z-index: 100;
			}

			#status-splash {
				max-height: 80%;
				max-width: 80%;
				margin: auto;
			}

			#status-splash.show-image--false {
				display: none;
			}

			#status-splash.fullsize--true {
				height: 100%;
				width: 100%;
				object-fit: contain;
			}

			#status-progress, #status-notice {
				display: none;
			}

			#status-progress {
				bottom: 12%;
				width: 60%;
				max-width: 360px;
				height: 14px;
				margin: 0 auto;
				accent-color: #D49B43;
			}

			#status-notice {
				background-color: #5b3943;
				border-radius: 0.5rem;
				border: 1px solid #9b3943;
				color: #e0e0e0;
				font-family: 'Outfit', sans-serif;
				line-height: 1.3;
				margin: 0 2rem;
				overflow: hidden;
				padding: 1rem;
				text-align: center;
				z-index: 101;
			}

			/* In fullscreen mode */
			:fullscreen .bottom-controls,
			:-webkit-full-screen .bottom-controls {
				display: none;
			}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
		<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
	</head>
	<body>
		<div class="game-container" id="game-container">
			<canvas id="canvas">
				Your browser does not support the canvas tag.
			</canvas>

			<noscript>
				Your browser does not support JavaScript.
			</noscript>

			<div id="status">
				<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
				<progress id="status-progress"></progress>
				<div id="status-notice"></div>
			</div>
		</div>

		<!-- Fullscreen Button -->
		<div class="bottom-controls">
			<button class="btn-fullscreen" id="btn-fullscreen" title="Layar Penuh">
				<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
					<path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
				</svg>
				<span>Layar Penuh</span>
			</button>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":11053308,"index.wasm":37900721},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

// Fullscreen Button Handler
const btnFullscreen = document.getElementById('btn-fullscreen');
btnFullscreen.addEventListener('click', () => {
	if (!document.fullscreenElement && !document.webkitFullscreenElement) {
		if (document.documentElement.requestFullscreen) {
			document.documentElement.requestFullscreen();
		} else if (document.documentElement.webkitRequestFullscreen) {
			document.documentElement.webkitRequestFullscreen();
		}
	} else {
		if (document.exitFullscreen) {
			document.exitFullscreen();
		} else if (document.webkitExitFullscreen) {
			document.webkitExitFullscreen();
		}
	}
});

// Unlock WebAudio on first gesture
window.addEventListener('pointerdown', () => {
	if (typeof AudioContext !== 'undefined') {
		const ctx = new AudioContext();
		if (ctx.state === 'suspended') {
			ctx.resume();
		}
	}
}, { once: true });

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
